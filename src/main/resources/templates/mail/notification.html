<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body style="margin: 0; padding: 24px 12px; background-color: #eef1f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="560"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 560px; width: 100%; background-color: #ffffff; border-radius: 12px; overflow: hidden;"
          >
            <tr>
              <td style="background-color: #0d1f33; padding: 20px 32px;">
                <span style="color: #eef4fa; font-size: 16px; font-weight: 600; letter-spacing: 0.02em;">Prayer Roster</span>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px;">
                <p th:text="${body}" style="margin: 0; color: #222222; font-size: 15px; line-height: 1.6;">Message</p>
                <table
                  th:if="${actionUrl}"
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="margin-top: 28px;"
                >
                  <tr>
                    <td style="border-radius: 8px; background-color: #2e6a9e;">
                      <a
                        th:href="${actionUrl}"
                        th:text="${actionLabel}"
                        style="display: inline-block; padding: 12px 24px; color: #ffffff; font-size: 15px; font-weight: 600; text-decoration: none;"
                        >Action</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 32px 28px; border-top: 1px solid #e6e9ec;">
                <p style="margin: 16px 0 0; color: #8a929b; font-size: 12px; line-height: 1.5;">Cet e-mail a été envoyé automatiquement par Prayer Roster.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
